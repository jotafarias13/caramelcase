# Alembic: the database migrations of the API.
#
#   uv run alembic upgrade head                           apply every migration
#   uv run alembic revision --autogenerate -m "add x"     write a new one
#   uv run alembic check                                  fail if models and migrations differ
#   uv run alembic downgrade -1                           undo the last one
#
# The database URL is not set here: app/db/migrations/env.py takes it from
# app/settings.py, that is, from DATABASE_URL.

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os

# Migration files sort by the time they were written (UTC).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# A new migration file is formatted and fixed with ruff as it is written.
[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

# Logging of the alembic command line itself.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
