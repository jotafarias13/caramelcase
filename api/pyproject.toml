[project]
name = "caramelcase-api"
version = "0.1.0"
description = "CaramelCase API: practice sessions of computer science questions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.9",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "loguru>=0.8.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "typer>=0.29.1",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the database engine holds connections
# bound to the loop that opened them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# The repository root, so that the tests can import content.tools.
pythonpath = [".."]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["I", "F", "E", "W", "PL", "PT", "N", "FURB", "FAST", "RUF", "ARG", "PTH", "UP", "B"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
# content is the repository's content/ package, which the tests import.
known-first-party = ["content"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
# A route takes one parameter per dependency.
"app/routes/*" = ["PLR0913", "PLR0917"]
# A typer command takes one parameter per option.
"../content/tools/*" = ["PLR0913"]
# conftest exports the test environment before importing the app.
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "../content/tools"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.15.0",
    "types-authlib>=1.8.0.20261106",
    "types-pyyaml>=6.0.12.20261113",
]
