# The subject catalog, in the order subjects are shown and generated.
#
# `python -m app.cli seed` copies it to the subjects table: a new subject
# is created as a draft, an existing one gets its names, badge and order
# updated, and its status is left alone.
#
#   slug          stable id; the first part of every question id
#   name_pt/_en   the subject's name in each language
#   short_pt/_en  the label on the subject's badge ("ed" is shown as "ed/")
#   typical_year  a rough guide for Brazilian computing degrees, to be
#                 checked against the real curriculum
#   launch        true for the three subjects V1 launches with
#
# Topics are added under each subject in milestone 3.

subjects:
  - slug: introducao-a-programacao
    name_pt: Introdução à Programação
    name_en: Introduction to Programming
    short_pt: prog
    short_en: prog
    typical_year: "1"
    launch: true

