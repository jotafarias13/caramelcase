name: Build and publish images

# Manual: Actions, "Build and publish images", Run workflow, on main. Builds
# the API's and the web app's images and pushes them to Docker Hub as
# <user>/<repository>-api and -web, tagged main and main-<short sha>. The
# deploy workflow then puts them on the server. docs/RUNBOOK.md lists the
# secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    # Build only a commit whose checks pass.
    uses: ./.github/workflows/ci.yaml

  build-publish:
    name: Build and publish ${{ matrix.image }}
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image: [api, web]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Name the image
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          REPOSITORY: ${{ github.repository }}
        run: echo "DOCKER_IMAGE=$DOCKER_HUB_USERNAME/$(basename "$REPOSITORY")-${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,format=short,prefix=main-

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # One cache per image, so the two builds do not evict each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # The web app's optional keys (src/lib/monitoring.ts). An unset
          # secret is empty, which leaves the service off. The API's image
          # declares none of them.
          build-args: |
            VITE_BETTER_STACK_ERRORS_DSN=${{ secrets.VITE_BETTER_STACK_ERRORS_DSN }}
            VITE_PLAUSIBLE_DOMAIN=${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
            VITE_PLAUSIBLE_SCRIPT=${{ secrets.VITE_PLAUSIBLE_SCRIPT }}

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Published $DOCKER_IMAGE with the tags:"
          while read -r tag; do echo "  - $tag"; done <<< "$TAGS"
