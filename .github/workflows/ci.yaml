name: CI

on:
  push:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install Python
        run: uv python install
        working-directory: api

      - name: Install the project
        run: uv sync --locked
        working-directory: api

      - name: Lint
        run: make lint-api

      - name: Type check
        run: make typecheck-api

      # testcontainers starts Postgres 16 on the runner's Docker. The tests
      # of content/tools compile C with the runner's cc.
      - name: Test
        run: make test-api

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the project
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Lint
        run: make lint-web

      - name: Type check
        run: make typecheck-web

      - name: Test
        run: make test-web

      - name: Build
        run: make build-web
