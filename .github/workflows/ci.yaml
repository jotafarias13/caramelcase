name: CI

on:
  push:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install Python
        run: uv python install
        working-directory: api

      - name: Install the project
        run: uv sync --locked
        working-directory: api

      - name: Lint
        run: make lint-api

      - name: Type check
        run: make typecheck-api

      # testcontainers starts Postgres 16 on the runner's Docker. The tests
      # of content/tools compile C with the runner's cc.
      - name: Test
        run: make test-api

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the project
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Lint
        run: make lint-web

      - name: Type check
        run: make typecheck-web

      - name: Test
        run: make test-web

      - name: Build
        run: make build-web

  # The production files that no image build would catch: the shell
  # scripts, and nginx's configurations, which the server reads from git.
  deploy:
    name: Deploy files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check the scripts and nginx's configurations
        run: make check-deploy

  # What a new developer does after cloning, then the Playwright test on
  # top: make up, make seed, make e2e.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Start the stack
        run: make up

      - name: Seed the database
        run: make seed

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web project
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Play a session
        run: make e2e

      - name: Logs of the stack
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
