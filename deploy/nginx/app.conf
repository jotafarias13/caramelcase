# The app: the built web app, with the API under /api. Included by the
# server block of DOMAIN in default.conf.http and default.conf.https.
#
# A location with an add_header of its own drops every header set here, so
# only the API's rate-limit answer has one (Retry-After).

root /usr/share/nginx/html;
index index.html;
client_max_body_size 1m;

add_header Cache-Control $cache_control;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

# Any address that is not a file is the single-page app.
location / {
    try_files $uri /index.html;
}

# A missing script or stylesheet is a 404, not the app's HTML.
location /assets/ {
    try_files $uri =404;
}

# The PWA's manifest; its extension is not in nginx's mime.types.
location = /manifest.webmanifest {
    default_type application/manifest+json;
}

location /api/ {
    limit_req zone=api burst=60 nodelay;

    # The address in a variable makes nginx look it up through the
    # resolver (nginx.conf) instead of once at start, so a replaced API
    # container is found at its new address. The request's path is passed
    # on as it came.
    set $api http://api:8000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API's rate limits trust X-Real-IP (api/app/client_ip.py): it is
    # overwritten here with the caller's address, whatever the caller sent.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # nginx's own errors in the API's error shape. The API's responses,
    # its own 429 and 503 included, pass through unchanged.
    error_page 429 = @api_rate_limited;
    error_page 502 504 = @api_unavailable;
}

location @api_rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Try again in a moment."}}';
}

# The API is down or restarting. The web app shows its maintenance screen.
location @api_unavailable {
    default_type application/json;
    return 502 '{"error":{"code":"api_unavailable","message":"The API is not answering. Try again in a moment."}}';
}
