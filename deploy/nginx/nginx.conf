# nginx's main configuration, the same in every mode. The server blocks
# are in the template NGINX_CONF_FILE names (default.conf.http,
# default.conf.https or default.conf.https.temp), which the image renders
# into conf.d/default.conf with ${DOMAIN} filled in.

user nginx;
worker_processes auto;
# Plain text: nginx cannot write its error log as JSON. Warnings and up.
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # One JSON object per line, on the container's output (the image links
    # access.log to it): `docker compose logs nginx`. request_id is the
    # API's X-Request-ID, which the API's own line for the request carries.
    log_format json_lines escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$upstream_http_x_request_id",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';
    access_log /var/log/nginx/access.log json_lines;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Requests to /api per network address (app.conf). A campus can reach
    # us from one address, so this stops a script, not a classroom; the
    # API's own limits per route are the finer ones.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # Docker's DNS, so that the API is looked up again when its container
    # is replaced (app.conf, location /api/).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # How long a browser may keep a file. Vite's files in /assets/ have
    # their hash in the name and never change; anything else is checked on
    # every use, which its ETag answers with a 304. The API sets its own.
    map $uri $cache_control {
        ~^/assets/  "public, max-age=31536000, immutable";
        ~^/api/     "";
        default     "no-cache";
    }

    # For the container's healthcheck (deploy/docker-compose.yml), on the
    # container's own loopback only.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /health {
            return 200 "ok\n";
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
