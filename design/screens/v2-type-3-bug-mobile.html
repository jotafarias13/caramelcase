mns: 34px minmax(0, 1fr) 32px; align-items: center; width: 100%; min-height: 44px; padding: 0; border: 0; background: var(--ink-selected); box-shadow: inset 0 0 0 2px var(--action); color: var(--ink-text); font-family: var(--font-mono); font-size: 13px; line-height: 21px; white-space: pre; font-variant-ligatures: none; text-align: left; cursor: pointer"><span style="padding-right: 12px; text-align: right; color: var(--action); font-weight: 700">3</span><span>    <span style="color: var(--syn-keyword)">for</span> i <span style="color: var(--syn-keyword)">in</span> <span style="color: var(--syn-function)">range</span>(<span style="color: var(--syn-function)">len</span>(vetor) + <span style="color: var(--syn-number)">1</span>):</span><svg data-lucide="circle-check" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; flex-shrink: 0; color: var(--action)"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg></button><button type="button" role="radio" aria-checked="false" aria-label="Linha 4" style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 32px; align-items: center; width: 100%; min-height: 44px; padding: 0; border: 0; background: transparent; box-shadow: none; color: var(--ink-text); font-family: var(--font-mono); font-size: 13px; line-height: 21px; white-space: pre; font-variant-ligatures: none; text-align: left; cursor: pointer"><span style="padding-right: 12px; text-align: right; color: var(--ink-subtle); font-weight: 400">4</span><span>        total += vetor[i]</span><span></span></button><button type="button" role="radio" aria-checked="false" aria-label="Linha 5" style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 32px; align-items: center; width: 100%; min-height: 44px; padding: 0; border: 0; background: transparent; box-shadow: none; color: var(--ink-text); font-family: var(--font-mono); font-size: 13px; line-height: 21px; white-space: pre; font-variant-ligatures: none; text-align: left; cursor: pointer"><span style="padding-right: 12px; text-align: right; color: var(--ink-subtle); font-weight: 400">5</span><span>    <span style="color: var(--syn-keyword)">return</span> total</span><span></span></button></div></div></div><div style="margin-top: auto; padding-right: 4px"><button type="button" style="height: 52px; box-sizing: border-box; padding: 0 22px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--action); color: var(--on-action); border: var(--btn-border); border-radius: var(--radius-lg); box-shadow: 4px 4px 0 var(--action-shadow); font-family: var(--font-sans); font-size: 16px; font-weight: 700; white-space: nowrap; cursor: pointer; width: 100%"><span>Verificar</span></button></div></div>
