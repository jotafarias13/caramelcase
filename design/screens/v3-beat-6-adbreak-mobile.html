<!doctype html>
<!-- caramelCase · V3 · Beat the ad · ad break frame · mobile · frame 360 × 800 px

<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>caramelCase · V3 · Beat the ad · ad break frame · mobile</title>
<link rel="stylesheet" href="../tokens.css">
<style>

body{display:flex;justify-content:center}

</style>
</head>
<body>
<div data-screen="v3-beat-6-adbreak" data-device="mobile" style="position: relative; width: 360px; min-height: 800px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: var(--font-sans); display: flex; flex-direction: column; overflow: hidden">

</div>

</html>
