<!doctype html>

<html lang="pt-BR" data-theme="dark">

</style>
</head>

ckground: var(--bg-well); color: var(--text); border: 1.5px solid var(--border-strong); border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 16px; height: 48px"></div></div><div style="padding-right: 4px"><button type="button" style="height: 52px; box-sizing: border-box; padding: 0 22px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--action); color: var(--on-action); border: var(--btn-border); border-radius: var(--radius-lg); box-shadow: 4px 4px 0 var(--action-shadow); font-family: var(--font-sans); font-size: 16px; font-weight: 700; white-space: nowrap; cursor: pointer; width: 100%"><span>Assinar por R$ 40 por mês</span></button></div></div><div style="display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card)"><div style="display: flex; align-items: center; gap: 8px; justify-content: space-between"><div style="display: flex; align-items: center; gap: 8px"><span style="font-family: var(--font-mono); font-size: 14px; line-height: 20px; color: var(--text); font-weight: 800">pro</span><div style="display: flex; align-items: center; gap: 5px; padding: 2px 8px; background: var(--brand); color: var(--on-brand); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 11px; line-height: 16px; font-weight: 700; white-space: nowrap; width: max-content"><span>Recomendado</span></div></div><div style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: var(--font-mono); font-size: 22px; line-height: 26px; color: var(--text); font-weight: 800">R$ 40</span><span style="font-size: 13px; line-height: 18px; font-weight: 400; color: var(--text-muted)">/mês</span></div></div><div role="radiogroup" aria-label="Cobrança" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--bg-well); border: 1.
